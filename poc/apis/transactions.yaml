openapi: "3.0.3"
info:
  title: "Transactions API"
  version: "1.0.0"
  description: "Synthetic banking facade for gateway evaluation only. No real customer data."
servers:
  - url: "http://localhost:8000"
paths:
  /v1/transactions:
    get:
      summary: "List synthetic transactions"
      operationId: "listTransactions"
      tags:
        - "Transactions"
      security:
        - ApiKeyAuth: []
      parameters:
        - name: "accountId"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Successful synthetic response"
          headers:
            X-Correlation-ID:
              schema:
                type: "string"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "items"
                properties:
                  items:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        transactionId:
                          type: "string"
                        amount:
                          type: "number"
                        currency:
                          type: "string"
                        kind:
                          type: "string"
        "401":
          description: "Missing or invalid API key"
        "429":
          description: "Rate limit exceeded"
components:
  securitySchemes:
    ApiKeyAuth:
      type: "apiKey"
      in: "header"
      name: "apikey"
