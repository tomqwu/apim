services:
  mock-bank:
    build:
      context: ./services/mock-bank
    image: api-platform/mock-bank:local
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 20

  kong:
    image: kong:3.9.1
    depends_on:
      mock-bank:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yaml
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_PREFIX: /tmp/kong
      KONG_LOG_LEVEL: notice
    volumes:
      - ./kong/deck/kong.yaml:/kong/declarative/kong.yaml:ro
    ports:
      - "8000:8000"
      - "127.0.0.1:8100:8100"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1777
    security_opt: ["no-new-privileges:true"]
